# Communication-constrained scenario
n_agents: 20
scenario: "communication_constrained"
max_steps: 200
total_episodes: 3500

actor_lr: 3.0e-4
critic_lr: 1.0e-3
gamma: 0.99
clip_eps: 0.2
entropy_coef: 0.015

n_resources: 5
dual_lr: 1.0e-3
consensus_alpha: 0.05          # slower consensus under constrained communication
consensus_max_iters: 50
cbf_alpha: 0.6

log_dir: "results/comm_constrained"
seed: 42
